name: RootsSkyBattlePass
version: 1.0.0
main: com.rootssky.battlepass.BattlePassPlugin
api-version: '1.21'
depend: [SuperiorSkyblock2, Vault]
softdepend: [PlaceholderAPI]

commands:
  battlepass:
    description: "Abrir menu do Passe de Batalha"
    aliases: [bp, passe]
    permission: rootssky.passe.use
  passeadmin:
    description: "Comandos administrativos do Passe de Batalha"
    aliases: [passeadm, bpadmin]
    permission: rootssky.passe.admin

permissions:
  rootssky.passe.use:
    description: "Permite usar o comando /passe"
    default: true
  rootssky.passe.admin:
    description: "Permite usar comandos administrativos"
    default: op
  rootssky.passe.vip:
    description: "Acesso ao Battle Pass VIP (1.5x XP + recompensas exclusivas)"
    default: false