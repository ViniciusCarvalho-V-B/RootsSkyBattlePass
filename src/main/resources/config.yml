settings:
  xp-formula: "level * 150"
  max-level: 100
  premium-xp-multiplier: 1.5

gui:
  # Titulos das GUIs (usam MiniMessage)
  title-battlepass: "<gradient:#00cccc:#00ffff>Passe de Batalha</gradient> <dark_gray>— <gradient:#55ff55:#00aa00>RootsSky</gradient>"
  title-missions: "<gradient:#55ff55:#00aa00>Missoes</gradient> <dark_gray>— <gradient:#00cccc:#00ffff>Passe de Batalha</gradient>"

  # Paginacao
  items-per-page: 8

  # Cooldown do botao "Resgatar Tudo" (em segundos)
  resgatar-tudo-cooldown: 3

  # Materiais do Passe de Batalha (GUI principal)
  material-free-available: CYAN_STAINED_GLASS_PANE
  material-free-claimed: GRAY_STAINED_GLASS_PANE
  material-free-locked: RED_STAINED_GLASS_PANE
  material-vip-available: ORANGE_STAINED_GLASS_PANE
  material-vip-claimed: GRAY_STAINED_GLASS_PANE
  material-vip-locked: RED_STAINED_GLASS_PANE
  material-vip-no-access: BLACK_STAINED_GLASS_PANE
  material-divider: GOLDEN_CHESTPLATE
  material-divider-no-access: BARRIER
  material-navigation-arrow: ARROW
  material-page-indicator: PAPER
  material-close: BARRIER
  material-fill: CYAN_STAINED_GLASS_PANE
  material-border: GRAY_STAINED_GLASS_PANE
  material-label-free: LIME_BANNER
  material-label-vip: YELLOW_BANNER
  material-label-vip-no-access: GRAY_BANNER
  material-cabecalho-bg: GRAY_CONCRETE
  material-cabecalho-player: PLAYER_HEAD
  material-recompensa-free: CHEST
  material-recompensa-vip: GOLD_BLOCK
  material-resgatar-tudo: HOPPER
  material-livro-missoes: BOOK

  # Materiais da GUI de Missoes
  mission-indicator-daily: IRON_BLOCK
  mission-indicator-weekly: GOLD_BLOCK
  mission-indicator-monthly: DIAMOND_BLOCK
  mission-back-button: ARROW
  mission-close-button: BARRIER
  mission-fill: GRAY_CONCRETE
  mission-book: BOOK

  # Barra de progresso
  progress:
    show-progress-bars: true
    progress-bar-char-filled: "▓"
    progress-bar-char-empty: "░"
    progress-bar-length: 10

messages:
  prefix: "<gradient:#55ff55:#00aa00><bold>[RootsSky]</bold></gradient> "
  welcome: "<gray>Olá <white>%player%</white>! Seu nível do Passe: <gold>%level%</gold>"
  level-up: "<gradient:#ffaa00:#ffff55>⚡ <bold>LEVEL UP!</bold> Agora você é Nível <gold>%level%</gold>!</gradient>"
  xp-gained: "<gray>+%xp% XP</gray>"
  no-permission: "<red>✗ Sem permissão.</red>"
  reloaded: "<green>✓ Configurações recarregadas!</green>"
  profile: "<yellow>%player%</yellow> <gray>- Nível: <gold>%level%</gold> | XP: <gold>%xp%</gold>/<gold>%required%</gold>"
  premium-only: "<gradient:#ffaa00:#ffff55>⭐ Isso é exclusivo para jogadores <bold>VIP</bold>!</gradient>"
  reward-claimed: "<green>✅ Recompensa do nível <bold>%nivel%</bold> resgatada!</green>"
  reward-already: "<gray>⚠️ Você já resgatou esta recompensa.</gray>"
  reward-locked: "<red>🔒 Nível <bold>%nivel%</bold> necessário para esta recompensa.</red>"
  vip-required: "<gradient:#ffaa00:#ffff55>⭐ Esta recompensa é exclusiva para jogadores <bold>VIP</bold>!</gradient>"
  no-reward: "<gray>❌ Nenhuma recompensa configurada para este nível.</gray>"
  mission-claimed: "<green>Recompensa da missao <bold>%mission%</bold> resgatada! <dark_gray>(+%xp% XP)%xp_bonus%</dark_gray></green>"
  mission-reset: "<gray>🔄 Missões %period% foram resetadas!</gray>"

missions:
  daily:
    mine_50:
      type: MINERAR
      target: 50
      xp_reward: 30
      reset_hours: 24
      icon: IRON_PICKAXE
      name: "Minerador Iniciante"
      description: "Minere 50 blocos de minério"
    kill_20:
      type: MATAR_MOBS
      target: 20
      xp_reward: 40
      reset_hours: 24
      icon: IRON_SWORD
      name: "Cacador de Mobs"
      description: "Elimine 20 mobs hostis"
    fish_15:
      type: PESCAR
      target: 15
      xp_reward: 35
      reset_hours: 24
      icon: FISHING_ROD
      name: "Pescador"
      description: "Pesque 15 peixes"
    craft_10:
      type: CRAFTAR
      target: 10
      xp_reward: 25
      reset_hours: 24
      icon: CRAFTING_TABLE
      name: "Artesao"
      description: "Crafte 10 itens"
    harvest_64:
      type: COLHER
      target: 64
      xp_reward: 30
      reset_hours: 24
      icon: GOLDEN_HOE
      name: "Fazendeiro"
      description: "Colha 64 plantacoes"
    eat_5:
      type: COMER
      target: 5
      xp_reward: 15
      reset_hours: 24
      icon: COOKED_BEEF
      name: "Guloso"
      description: "Coma 5 itens"
    build_200:
      type: COLOCAR_BLOCOS
      target: 200
      xp_reward: 50
      reset_hours: 24
      icon: BRICKS
      name: "Construtor"
      description: "Coloque 200 blocos"

  weekly:
    kill_100:
      type: MATAR_MOBS
      target: 100
      xp_reward: 150
      reset_hours: 168
      icon: DIAMOND_SWORD
      name: "Guerreiro Semanal"
      description: "Elimine 100 mobs hostis"
    mine_200:
      type: MINERAR
      target: 200
      xp_reward: 200
      reset_hours: 168
      icon: DIAMOND_PICKAXE
      name: "Mineiro Profissional"
      description: "Mine 200 blocos de minério"
    fish_50:
      type: PESCAR
      target: 50
      xp_reward: 120
      reset_hours: 168
      icon: FISHING_ROD
      name: "Mestre Pescador"
      description: "Pesque 50 peixes"
    craft_50:
      type: CRAFTAR
      target: 50
      xp_reward: 180
      reset_hours: 168
      icon: CRAFTING_TABLE
      name: "Fabricante Semanal"
      description: "Crafte 50 itens"

  monthly:
    kill_500:
      type: MATAR_MOBS
      target: 500
      xp_reward: 500
      reset_hours: 720
      icon: NETHERITE_SWORD
      name: "Lenda de Guerra"
      description: "Elimine 500 mobs hostis"
    mine_1000:
      type: MINERAR
      target: 1000
      xp_reward: 600
      reset_hours: 720
      icon: NETHERITE_PICKAXE
      name: "Escavador Lendario"
      description: "Mine 1000 blocos de minério"

